<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vocab Node screens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Patrick+Hand&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 1920×1080 stage, scaled to fit. Scenes: #call, #lesson, #task. Add ?clean to hide the controls. -->
    <div id="viewport">
      <div id="stage" aria-label="Vocab Node product recreation"></div>
    </div>
    <nav id="controls" aria-label="Scenes">
      <button type="button" data-scene="call">Live class</button>
      <button type="button" data-scene="lesson">AI lesson</button>
      <button type="button" data-scene="task">Student task</button>
      <span class="sep"></span>
      <button type="button" id="play-all">Play all</button>
      <button type="button" id="replay">Replay ↻</button>
      <label>Speed <select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
    </nav>
    <script src="app.js"></script>
  </body>
</html>
