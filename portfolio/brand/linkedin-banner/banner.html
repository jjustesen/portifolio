<!doctype html>
<!-- LinkedIn banner (1584×396) in the portfolio's visual language: the chromatic light ring from the
     Lab section, Georgia display type, mono labels, grease-pencil notes and film grain.
     Render: see README.md in this folder. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>LinkedIn banner</title>
<style>
  @font-face { font-family: Caveat; src: url(caveat-latin-400-normal.woff2) format('woff2'); }
  :root { --bg: #080809; --fg: #f0efeb; --muted: #aaa; --note: #ff5a36; }
  html, body { margin: 0; background: var(--bg); }
  .banner { position: relative; width: 1584px; height: 396px; overflow: hidden; background: var(--bg); color: var(--fg); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .grain { mix-blend-mode: exclusion; }
  .content { position: absolute; left: 440px; top: 74px; }
  .label { font: 12px ui-monospace, 'SFMono-Regular', Consolas, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg); margin: 0; }
  h1 { font: 400 44px/1.12 Georgia, 'Times New Roman', serif; letter-spacing: -0.01em; margin: 22px 0 24px; }
  .meta { color: var(--muted); }
  svg.notes { position: absolute; inset: 0; overflow: visible; color: var(--note); }
  svg.notes path { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  svg.notes text { fill: currentColor; font: 400 28px Caveat, cursive; }
</style>
</head>
<body>
<div class="banner" id="banner">
  <canvas id="bg" width="1584" height="396"></canvas>
  <div class="content">
    <p class="label">AI products / Interaction / Systems</p>
    <h1 id="headline">Interfaces between<br>complex systems and<br><span id="mark">human intuition</span>.</h1>
    <p class="label meta">Johannes Justesen &nbsp;·&nbsp; Frontend Engineer &nbsp;·&nbsp; Norway / EU</p>
  </div>
  <svg class="notes" id="notes" width="1584" height="396"></svg>
  <canvas id="grain" class="grain" width="1584" height="396"></canvas>
</div>
<script>
// ?scale=2 renders a sharper copy: the banner is scaled up as a whole (canvases at that resolution).
const SCALE = Number(new URLSearchParams(location.search).get('scale')) || 1;
if (SCALE !== 1) Object.assign(document.getElementById('banner').style, { transform: `scale(${SCALE})`, transformOrigin: '0 0' });

// ---- Background: the site's light ring shader (background part only), frozen at one moment.
const RING = { center: [0.815, 0.5], radius: 0.6, glow: 2.0, chroma: 1.0, time: 18.0 };
const canvas = document.getElementById('bg');
const dpr = SCALE;
canvas.width = 1584 * dpr; canvas.height = 396 * dpr;
const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
const vs = `attribute vec2 a;varying vec2 uv;void main(){uv=a*.5+.5;gl_Position=vec4(a,0.,1.);}`;
const fs = `precision highp float;varying vec2 uv;
uniform float uTime,uAspect,uRadius,uGlow,uChroma;uniform vec2 uCenter;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1)),f.x),f.y);}
float fbm(vec2 p){float n=0.,a=.5;for(int i=0;i<4;i++){n+=noise(p)*a;p=p*2.03+7.1;a*=.5;}return n;}
vec3 thermal(float d){
  vec3 c=mix(vec3(.30,.95,1.),vec3(.12,.30,1.),smoothstep(0.,.18,d));
  c=mix(c,vec3(.32,.06,.78),smoothstep(.18,.34,d));
  c=mix(c,vec3(.06,.02,.14),smoothstep(.34,.46,d));
  c=mix(c,vec3(.86,.14,.08),smoothstep(.46,.60,d));
  c=mix(c,vec3(1.,.56,.10),smoothstep(.60,.74,d));
  c=mix(c,vec3(1.,.92,.56),smoothstep(.74,.88,d));
  return mix(c,vec3(.94),smoothstep(.88,1.,d));
}
void main(){
  vec2 p=uv*vec2(uAspect,1.);
  float smoke=fbm(p*1.6+fbm(p*1.1+uTime*.015)+vec2(uTime*.02,-uTime*.012));
  float base=.025+pow(smoothstep(.28,.85,smoke),1.6)*.34;
  vec2 q=p-vec2(uAspect*uCenter.x,uCenter.y);
  float ang=atan(q.y,q.x),r=length(q);
  float wobble=(fbm(vec2(cos(ang),sin(ang))*1.6+uTime*.05+p*1.4)-.5)*.09;
  float d=r-(uRadius+wobble);
  float strands=exp(-pow(d/.022,2.))*.9+exp(-pow((d+.07)/.045,2.))*.55;
  float halo=exp(-abs(d+.03)/.12)*.35;
  float arc=.25+.75*smoothstep(-.3,1.,cos(ang-2.2));
  float hot=pow(max(cos(ang-2.0),0.),40.)*exp(-pow(d/.04,2.))*1.4;
  float ring=((strands+halo)*arc+hot)*(.65+.7*fbm(p*7.+uTime*.02))*uGlow;
  // Keep the left side (profile photo, text) quiet: the smoke fades toward it.
  base*=mix(.35,1.,smoothstep(.1,.55,uv.x));
  float bg=base+ring*.7;
  float ringLight=bg-base;
  vec3 heatRing=thermal(clamp(ringLight*.85,0.,1.))*min(1.,ringLight*2.5);
  vec3 color=vec3(base)+mix(vec3(ringLight),heatRing,uChroma);
  gl_FragColor=vec4(color,1.);
}`;
function shader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const u = (n) => gl.getUniformLocation(prog, n);
gl.uniform1f(u('uTime'), RING.time); gl.uniform1f(u('uAspect'), 1584 / 396);
gl.uniform1f(u('uRadius'), RING.radius); gl.uniform1f(u('uGlow'), RING.glow); gl.uniform1f(u('uChroma'), RING.chroma);
gl.uniform2f(u('uCenter'), RING.center[0], RING.center[1]);
gl.viewport(0, 0, canvas.width, canvas.height);
gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

// ---- Grain: smooth value noise in 2.5px cells, composited with exclusion (as on the site).
const grain = document.getElementById('grain');
grain.width = 1584 * dpr; grain.height = 396 * dpr;
{
  const g = grain.getContext('2d'), cell = 2.5 * dpr;
  const cw = Math.ceil(grain.width / cell) + 2, ch = Math.ceil(grain.height / cell) + 2;
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const cells = new Float32Array(cw * ch).map(rnd);
  const img = g.createImageData(grain.width, grain.height);
  for (let y = 0; y < grain.height; y++) for (let x = 0; x < grain.width; x++) {
    const fx = x / cell, fy = y / cell, ix = Math.floor(fx), iy = Math.floor(fy);
    let tx = fx - ix, ty = fy - iy; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
    const a = cells[iy * cw + ix], b = cells[iy * cw + ix + 1], c = cells[(iy + 1) * cw + ix], d = cells[(iy + 1) * cw + ix + 1];
    let v = (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
    v = Math.min(1, Math.max(0, (v - 0.5) * 1.8 + 0.5));
    const n = Math.round(v * 0.28 * 0.18 * 255), i = (y * grain.width + x) * 4;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = n; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
}

// ---- Grease-pencil notes (same hand-tremor strokes as the site's margin notes).
function mulberry32(s) { return () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function handLine(a, b, rng, jitter, n = 18) {
  const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, nx = -(b[1] - a[1]) / len, ny = (b[0] - a[0]) / len;
  const phase = rng() * 6, bow = (rng() - 0.5) * jitter * 3;
  return Array.from({ length: n + 1 }, (_, i) => { const t = i / n, w = Math.sin(t * Math.PI) * bow + Math.sin(t * 7 + phase) * jitter * 0.5; return [a[0] + (b[0] - a[0]) * t + nx * w, a[1] + (b[1] - a[1]) * t + ny * w]; });
}
function bezier(a, c, b, n = 28) { return Array.from({ length: n + 1 }, (_, i) => { const t = i / n, v = 1 - t; return [v * v * a[0] + 2 * v * t * c[0] + t * t * b[0], v * v * a[1] + 2 * v * t * c[1] + t * t * b[1]]; }); }
function arrowHead(tip, from, size, rng, jitter) {
  const angle = Math.atan2(tip[1] - from[1], tip[0] - from[0]);
  return [-1, 1].map((side) => { const a = angle + Math.PI + side * (0.45 + rng() * 0.15); return handLine(tip, [tip[0] + Math.cos(a) * size, tip[1] + Math.sin(a) * size], rng, jitter * 0.4, 5); });
}
const toD = (pts) => 'M' + pts.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join('L');

document.fonts.load('28px Caveat').then(() => document.fonts.ready).then(() => {
  const svg = document.getElementById('notes'), rng = mulberry32(11), J = 1.6;
  const path = (pts) => svg.insertAdjacentHTML('beforeend', `<path d="${toD(pts)}"/>`);
  const text = (s, x, y, rot) => svg.insertAdjacentHTML('beforeend', `<text x="${x}" y="${y}" transform="rotate(${rot} ${x} ${y})">${s}</text>`);
  const box = document.getElementById('banner').getBoundingClientRect();
  // Rects come back scaled; the notes are drawn inside the banner, in unscaled units.
  const rel = (r) => ({ left: (r.left - box.left) / SCALE, right: (r.right - box.left) / SCALE, top: (r.top - box.top) / SCALE, bottom: (r.bottom - box.top) / SCALE });
  // Headline extent: its text, not the block box.
  const range = document.createRange(); range.selectNodeContents(document.getElementById('headline'));
  const h = rel(range.getBoundingClientRect());
  // Crop marks around the headline.
  // The bottom marks sit a little lower, clear of the underline.
  const L = 24, o = 14, ob = 22;
  for (const [x, y, sx, sy] of [[h.left - o, h.top - o, 1, 1], [h.right + o, h.top - o, -1, 1], [h.right + o, h.bottom + ob, -1, -1], [h.left - o, h.bottom + ob, 1, -1]]) {
    path(handLine([x, y + sy * L], [x, y], rng, J, 6).concat(handLine([x, y], [x + sx * L, y], rng, J, 6)));
  }
  // Double underline under the phrase, with a note and arrow pointing at it.
  const m = rel(document.getElementById('mark').getClientRects()[0]);
  path(handLine([m.left - 4, m.bottom + 3], [m.right + 6, m.bottom + 5], rng, J + 0.6));
  path(handLine([m.left + 6, m.bottom + 9], [m.right - 10, m.bottom + 10], rng, J + 0.6));
  // "the whole point" in the free space after the short last line, arrow back to the underline.
  const tx = m.right + 70, ty = m.top + 16;
  text('the whole point', tx, ty, -5);
  const from = [tx - 8, ty + 4], to = [m.right + 14, m.bottom + 4];
  const mid = [(from[0] + to[0]) / 2 + (to[1] - from[1]) * 0.25, (from[1] + to[1]) / 2 - (to[0] - from[0]) * 0.25];
  const curve = bezier(from, mid, to);
  path(curve); for (const head of arrowHead(to, curve[curve.length - 4], 11, rng, J)) path(head);
  document.body.dataset.ready = '1';
});
</script>
</body>
</html>
